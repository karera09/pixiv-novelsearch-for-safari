<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixiv スタブ(E2E_OFFLINE 用)</title>
<!--
  pixiv に到達できない環境(クラウドのサンドボックス等)で `npm run e2e` を回すための代替ページ。
  本物の pixiv ではないが、HANDOVER 4章で踏んだ「干渉」を意図的に再現している:
    1. ページ側 CSS が input の文字を透明にする(Shadow DOM に閉じていないと文字が見えなくなる)
    2. document レベルのキー/入力ハンドラが入力を横取りする(stopPropagation していないと effect が出る)
    3. React 風に body 直下を定期的に描き直す(document.body 直下にマウントすると消される)
  本物の React/CSS との差はあるので、到達できるときは通常モード(本物のページ)で確認すること。
-->
<style>
  body { margin: 0; font-family: sans-serif; background: #fff; color: #333; }
  header { background: #0096fa; color: #fff; padding: 12px; }
  main { padding: 12px; }
  /* 1. 本物の pixiv で踏んだのと同じ系統の干渉: ページ側の input 装飾が全体に効く */
  input, select, textarea { color: transparent !important; -webkit-text-fill-color: transparent !important; opacity: 0.3 !important; }
  button { background: #000; color: #000; }
</style>
</head>
<body>
<header>pixiv スタブ(E2E_OFFLINE)</header>
<main>
  <p>このページは本物の pixiv ではありません。E2E のオフライン検証用スタブです。</p>
  <input placeholder="ページ側の検索欄(文字が透明になる)">
</main>
<script>
  // 2. document レベルの横取り(pixiv の React はグローバルにキー/入力イベントを拾う)
  for (const ev of ['keydown', 'keypress', 'input', 'beforeinput']) {
    document.addEventListener(ev, e => {
      // パネルから漏れてきたら入力を潰す。Shadow DOM 内で stopPropagation されていれば届かない
      if (e.target && e.target.id !== 'pxAndHost') { e.preventDefault(); window.__stubHijacked = (window.__stubHijacked || 0) + 1; }
    });
  }
  // 3. React 風の再描画: body 直下を定期的に作り直す(documentElement 直下の Shadow host は生き残る)
  const render = () => {
    const main = document.querySelector('main');
    if (main) main.innerHTML = '<p>再描画 ' + new Date().toISOString() + '</p><input placeholder="ページ側の検索欄">';
    for (const el of [...document.body.children]) if (!['HEADER', 'MAIN', 'SCRIPT'].includes(el.tagName)) el.remove();
  };
  setTimeout(render, 300);
  setInterval(render, 1000);
</script>
</body>
</html>
