name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

  # WebKit(iPhone 相当)でのタッチ/UI テスト(Linux)。
  #   online:  検索 API はモックだが pixiv のトップページ自体は読み込む。pixiv 側が CI の IP を弾くとこのジョブだけ失敗する
  #   offline: E2E_OFFLINE=1。pixiv に一切接続せず、干渉を再現したスタブページで検証する(クラウド環境と同じ条件)
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [online, offline]
    env:
      E2E_OFFLINE: ${{ matrix.mode == 'offline' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node e2e/cli.js install --with-deps
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.mode }}
          path: .playwright/report
